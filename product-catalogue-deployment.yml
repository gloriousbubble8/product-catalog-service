apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalogue
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: product-catalogue
  template:
    metadata:
      labels:
        app: product-catalogue
    spec:
      containers:
        - name: product-catalogue
          image: giridhar8888/product-catalogue-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
